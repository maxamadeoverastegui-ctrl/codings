<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flores Azul Neón</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }
    body{
        background:#000;
        overflow:hidden;
        height:100vh;
        width:100vw;
        font-family:Arial;
    }

    /* Fondo de estrellas */
    .stars {
        position:absolute;
        width:100%;
        height:100%;
        background: radial-gradient(#0ff2, transparent 60%) 0 0,
                    radial-gradient(#0ff2, transparent 60%) 50px 50px,
                    radial-gradient(#0ff2, transparent 60%) 100px 100px;
        background-size:120px 120px;
        opacity:0.3;
        animation: twinkle 6s linear infinite;
    }

    @keyframes twinkle {
        0% { opacity:0.2; }
        50% { opacity:0.5; }
        100% { opacity:0.2; }
    }

    /* CONTENEDOR PRINCIPAL */
    .scene {
        position:absolute;
        bottom:0;
        width:100%;
        height:100%;
    }

    /* BRILLOS QUE SUBEN */
    .spark {
        position:absolute;
        width:6px;
        height:6px;
        background:rgba(0,150,255,1);
        border-radius:50%;
        box-shadow:0 0 12px #00b7ff;
        animation: floatUp 6s linear infinite;
        opacity:0.8;
    }

    @keyframes floatUp {
        0% { transform:translateY(40px); opacity:0; }
        40% { opacity:1; }
        100% { transform:translateY(-350px); opacity:0; }
    }

    /* FLORES */
    .flower {
        position:absolute;
        bottom:50px;
        left:50%;
        transform:translateX(-50%);
        width:250px;
        height:300px;
    }

    /* Tallos */
    .stem {
        position:absolute;
        width:8px;
        height:160px;
        background:#008cff;
        left:50%;
        transform:translateX(-50%);
        box-shadow:0 0 12px #0af;
    }

    /* Pétalos */
    .petal {
        position:absolute;
        width:70px;
        height:35px;
        background: radial-gradient(circle, #4bc7ff, #008cff);
        border-radius:80px 80px 40px 40px;
        box-shadow:0 0 25px #00b7ff;
        transform-origin:bottom center;
        animation: sway 4s ease-in-out infinite;
    }

    @keyframes sway {
        0% { transform: rotate(0deg); }
        50% { transform: rotate(4deg); }
        100% { transform: rotate(0deg); }
    }

    /* Colocación de pétalos */
    .p1 { top:0; left:30%; transform:rotate(-15deg); }
    .p2 { top:0; left:0; transform:rotate(-30deg); }
    .p3 { top:0; left:60%; transform:rotate(20deg); }
    .p4 { top:15px; left:15%; transform:rotate(0deg); }

    /* Centro de la flor */
    .center {
        position:absolute;
        top:-10px;
        left:42%;
        width:35px;
        height:35px;
        background:#00caff;
        border-radius:50%;
        box-shadow:0 0 25px #00caff;
    }

    /* HOJAS */
    .leaf {
        position:absolute;
        width:60px;
        height:25px;
        background: radial-gradient(circle, #00eaff, #008cff);
        border-radius:40px;
        box-shadow:0 0 15px #00caff;
        transform-origin:left center;
    }

    .l1 { bottom:30px; left:40%; transform:rotate(-35deg); }
    .l2 { bottom:80px; left:60%; transform:rotate(25deg); }
    .l3 { bottom:110px; left:38%; transform:rotate(-20deg); }

</style>
</head>
<body>

<div class="stars"></div>

<div class="scene">

    <!-- Brillos -->
    <script>
        for(let i=0;i<50;i++){
            const s=document.createElement("div");
            s.className="spark";
            s.style.left=Math.random()*100+"vw";
            s.style.animationDelay=(Math.random()*5)+"s";
            s.style.animationDuration=(4+Math.random()*4)+"s";
            document.body.appendChild(s);
        }
    </script>

    <!-- FLORES -->
    <div class="flower">

        <div class="stem"></div>

        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>

        <div class="center"></div>

        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>

    </div>

</div>

</body>
</html>
