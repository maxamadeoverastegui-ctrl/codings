<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flores Azules</title>
<style>
    body {
        margin: 0;
        background: #000;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .flower {
        position: relative;
        width: 200px;
        height: 200px;
        animation: float 3s ease-in-out infinite alternate;
    }

    @keyframes float {
        0% { transform: translateY(0px) rotate(-3deg); }
        100% { transform: translateY(-20px) rotate(3deg); }
    }

    .petal {
        position: absolute;
        width: 120px;
        height: 160px;
        background: linear-gradient(135deg, #1fa4ff, #74d0ff);
        border-radius: 100% 60% 100% 60%;
        filter: drop-shadow(0 0 20px #1fa4ff);
        transform-origin: bottom center;
    }

    .petal:nth-child(1) {
        transform: rotate(0deg);
    }

    .petal:nth-child(2) {
        transform: rotate(60deg);
    }

    .petal:nth-child(3) {
        transform: rotate(120deg);
    }

    .petal:nth-child(4) {
        transform: rotate(180deg);
    }

    .petal:nth-child(5) {
        transform: rotate(240deg);
    }

    .petal:nth-child(6) {
        transform: rotate(300deg);
    }

    .center {
        width: 80px;
        height: 80px;
        background: radial-gradient(circle, #fff 0%, #5ecbff 50%, #1fa4ff 100%);
        border-radius: 50%;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 30px #5ecbff;
    }
</style>
</head>

<body>
    <div class="flower">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="center"></div>
    </div>
</body>
</html>
