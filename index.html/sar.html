<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flor Neon Creciendo</title>
<style>
    body {
        margin: 0;
        background: #000;
        overflow: hidden;
    }

    svg {
        position: absolute;
        bottom: -150px;
        left: 50%;
        transform: translateX(-50%) scale(1.2);
        filter: drop-shadow(0 0 12px #00c8ff) drop-shadow(0 0 20px #0094ff);
        animation: crecer 3.2s ease-out forwards;
    }

    @keyframes crecer {
        0% {
            transform: translateX(-50%) scale(0.05);
            opacity: 0;
        }
        40% {
            opacity: 1;
        }
        100% {
            transform: translateX(-50%) scale(1.3);
            opacity: 1;
        }
    }

    /* animación pétalos */
    .petalo {
        transform-origin: center;
        animation: abrir 2.5s ease-out forwards;
    }

    @keyframes abrir {
        0% { transform: scale(0.1); opacity: 0; }
        60% { opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }
</style>
</head>
<body>

<!-- FLOR ESTILO IMAGEN 3 (pero en azul neon) -->
<svg width="900" height="900" viewBox="0 0 200 200">
    <!-- Tallo curvo -->
    <path d="M100 200 C105 150 95 120 100 70"
          stroke="#00c8ff" stroke-width="6" fill="none"/>

    <!-- Hojas grandes estilo imagen 3 -->
    <path d="M100 140 C55 120 60 95 90 110"
          stroke="#00c8ff" stroke-width="5" fill="none" />

    <path d="M100 125 C140 115 145 90 110 100"
          stroke="#00c8ff" stroke-width="5" fill="none" />

    <!-- Grupo de pétalos estilo imagen 3 -->
    <g fill="#00aaff" stroke="#40d4ff" stroke-width="2" class="petalo">
        <circle cx="100" cy="55" r="15"/>
        <circle cx="82" cy="70" r="14"/>
        <circle cx="118" cy="70" r="14"/>
        <circle cx="90" cy="42" r="13"/>
        <circle cx="110" cy="42" r="13"/>
    </g>
</svg>

</body>
</html>
